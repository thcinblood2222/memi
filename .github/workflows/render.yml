name: Render night ambience memes
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Authorized direct MP4 URL for the original meme compilation"
        required: true
      background_url:
        description: "Authorized direct MP4 URL for the supplied Minecraft night ambience"
        required: true
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Retrieve supplied files
        env:
          SOURCE: ${{ inputs.source_url }}
          BACKGROUND: ${{ inputs.background_url }}
        run: |
          mkdir -p assets out
          curl --fail --location --retry 3 --output assets/source.mp4 "$SOURCE"
          curl --fail --location --retry 3 --output assets/background.mp4 "$BACKGROUND"
      - name: Render
        run: /usr/bin/python3 render.py --source assets/source.mp4 --background assets/background.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: night-memes
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
